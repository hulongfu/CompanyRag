version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: company-rag-postgres
    environment:
      POSTGRES_DB: company_rag
      POSTGRES_USER: ${POSTGRES_USER:-company_rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: company-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: company-rag-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      # 探针路径需与 application.yml 的 probes.enabled=true 与 SecurityConfig 放行保持一致
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  prometheus:
    image: prom/prometheus:latest
    container_name: company-rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml
      - promdata:/prometheus

  alertmanager:
    image: prom/alertmanager:latest
    container_name: company-rag-alertmanager
    ports:
      - "9093:9093"
    environment:
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_AUTHORIZATION_CODE: ${SMTP_AUTHORIZATION_CODE}
      SMTP_TO: ${SMTP_TO}
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: company-rag-grafana
    ports:
      - "3000:3000"
    environment:
      # 强制要求设置环境变量，不提供默认值（安全要求）
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD environment variable is required}
    volumes:
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  uploads:
