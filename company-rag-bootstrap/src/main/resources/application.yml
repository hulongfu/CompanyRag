server:
  port: ${SERVER_PORT:8080}
  # 优雅停机配置（K8s/Docker 停止时等待请求处理完成）
  shutdown: graceful

spring:
  application:
    name: company-rag
  # HTTP 客户端超时配置（Spring Boot 3.2+）
  # 适用于 RestClient 和 WebClient（包括流式响应）
  http:
    client:
      connect-timeout: 10s
      read-timeout: 120s
  lifecycle:
    # 优雅停机超时时间
    timeout-per-shutdown-phase: 30s
  mvc:
    # 注意：不能设置 static-path-pattern，否则会影响 SpringDoc Swagger UI 的静态资源加载
    # static-path-pattern: /static/**
  web:
    # 禁用 favicon，避免浏览器请求 /favicon.ico 导致 404 错误
    favicon:
      enabled: false
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 禁用 Spring Cloud Function 自动配置 (解决与 Spring Boot 3.4.4 的兼容性问题)
  cloud:
    function:
      enabled: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:company_rag}
    username: ${POSTGRES_USER:company_rag_app}
    password: ${POSTGRES_PASSWORD:company_rag_app123456}
    driver-class-name: org.postgresql.Driver
    # 注意：不能设置 connection-init-sql，因为会在每次获取连接时重置 search_path
    # 租户 schema 切换由 TenantContextHelper 在请求拦截器中动态设置
    # HikariCP 连接池配置
    hikari:
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接数
      maximum-pool-size: 20
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接超时时间（毫秒）
      idle-timeout: 600000
      # 连接最大生命周期（毫秒）
      max-lifetime: 1800000
      # 连接测试查询
      connection-test-query: SELECT 1
      # 连接池名称
      pool-name: CompanyRagHikariPool
      # 是否启用 JMX
      register-mbeans: true
  vectorstore:
    pgvector:
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      dimension: 1024
      remove-existing-vector-store-table: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

# SpringDoc OpenAPI 配置（使用默认路径）
# SpringDoc OpenAPI 配置（使用默认路径 /v3/api-docs 和 /swagger-ui.html）
springdoc:
  swagger-ui:
    operations-sorter: method
  show-actuator: false
  writer-with-default-pretty-printer: true

# Flyway 数据库迁移配置
# 说明：Flyway 用于生产环境自动执行数据库迁移脚本，确保多环境一致性
flyway:
  # 启用 Flyway
  enabled: true
  # 迁移脚本位置
  locations: classpath:db/migration
  # 编码
  encoding: UTF-8
  # 是否允许无序迁移（开发环境允许，生产环境建议禁止）
  out-of-order: false
  # 迁移脚本前缀
  prefix: V
  # 迁移脚本后缀
  suffix: .sql
  # 迁移脚本分隔符
  separator: ;
  # 校验迁移脚本
  validate-on-migrate: true
  # 清洁模式（生产环境应禁用）
  clean-disabled: true
  # 基础线版本（如果已有数据库）
  baseline-on-migrate: true
  baseline-version: 0
  # 是否自动调用 migrate
  migrate-at-startup: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL 日志，减少性能开销
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 与 Flyway 集成：Flyway 先执行迁移，MyBatis-Plus 后初始化
  dependency: org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  ratelimiter:
    configs:
      default:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 500ms

# Actuator / Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
    # 禁用敏感端点
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  # 安全配置：敏感端点需要认证
  security:
    enabled: true

# Agent 配置
agent:
  # Python 可执行文件路径（支持多环境配置）
  # 开发环境：D:/uv_project/mcp-server-docker/.venv/Scripts/python.exe
  # 生产环境：/usr/bin/python3 或 /opt/venv/bin/python
  python-exec-path: ${PYTHON_EXEC_PATH:D:/uv_project/mcp-server-docker/.venv/Scripts/python.exe}

# 代码搜索工具配置
app:
  code-search:
    # 代码搜索根目录（可选，默认使用项目根目录 user.dir）
    # 适用场景：
    # - Docker 部署时指定容器内源码路径
    # - 特殊项目结构需要自定义搜索范围
    # - 多代码仓库联合搜索
    src-base: ${CODE_SEARCH_SRC_BASE:D:/tmp/CompanyRag/company-rag-agent}

# 日志
logging:
  level:
    com.company.rag: DEBUG
    org.springframework.ai: INFO