spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/company_rag
  ai:
    # Spring AI Alibaba Agent Framework 配置
    alibaba:
      agent:
        # 启用 ReactAgent
        enabled: true
        # Skill Registry 配置
        skill:
          registry:
            # 文件系统扫描配置
            file-system:
              enabled: true
              paths:
                - ./agent_skills
    # 统一使用 OpenAI 兼容接口，chat 用通义千问，embedding/rerank 用硅基流动
    openai:
      # Chat 模型配置（通义千问 - OpenAI 兼容模式）
      chat:
        api-key: ${DASHSCOPE_API_KEY:default_dashscope_api_key}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        options:
          model: qwen3.7-plus
          temperature: 0.7
          # 注意：不能在这里配置 timeout，OpenAiChatOptions 没有 timeout 属性
          # 超时配置在 SpringAiTimeoutConfig 类中，通过 RestClient.Builder 实现
      # Embedding 模型配置（硅基流动 - OpenAI 兼容模式）
      embedding:
        api-key: ${SILICONFLOW_API_KEY:default_siliconflow_api_key}
        base-url: https://api.siliconflow.cn
        options:
          model: BAAI/bge-large-zh-v1.5
      # Rerank 模型配置（硅基流动 - 专用 Rerank API）
      rerank:
        api-key: ${SILICONFLOW_API_KEY:default_siliconflow_api_key}
        base-url: https://api.siliconflow.cn
        options:
          model: BAAI/bge-reranker-v2-m3
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:[REDACTED-REDIS-PASSWORD]}

# JWT 配置（开发环境临时配置，生产环境应通过环境变量）
jwt:
  secret: k07fDiqMxu5Fgnes77ASlM2Tl7CM9yCeiIZcWV8z9w8=

# 多路检索配置
rag:
  retrieval:
    # 多路检索配置
    vector-top-k: 50
    fulltext-top-k: 50
    fuzzy-top-k: 30
    
    # 融合配置
    score-threshold: 0.3
    fusion-top-k: 50

# MCP Client 配置：连接外部 MCP Server
mcp:
  enabled: true
  clients:
    # 本地测试 MCP Server（端口 9001）
    - id: custom
      name: 本地测试 MCP Server
      url: http://localhost:9001/mcp
      enabled: true
      timeout: 30000
    
    # 文件系统 MCP Server（可选）
    - id: filesystem
      name: 文件系统 MCP Server
      url: http://localhost:3000/mcp
      enabled: false
      timeout: 30000

logging:
  level:
    com.company.rag: DEBUG

# Flyway 配置（开发环境也启用，确保数据库结构一致性）
flyway:
  enabled: true
  # 迁移脚本位置
  locations: classpath:db/migration
  # 编码
  encoding: UTF-8
  # 基础线版本（如果已有数据库）
  baseline-on-migrate: true
  baseline-version: 0
  # 是否自动调用 migrate
  migrate-at-startup: true
  # 校验迁移脚本
  validate-on-migrate: true
  # 允许无序迁移（开发环境可用）
  out-of-order: true
