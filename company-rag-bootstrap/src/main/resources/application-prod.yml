spring:
  datasource:
    # 移除 currentSchema=public，让 TenantSchemaInterceptor 动态设置 search_path
    url: jdbc:postgresql://postgres:5433/company_rag
  ai:
    # 统一使用 OpenAI 兼容接口，chat 用通义千问，embedding/rerank 用硅基流动
    openai:
      # Chat 模型配置（通义千问 - OpenAI 兼容模式）
      chat:
        api-key: ${DASHSCOPE_API_KEY:you_dashscope_api_key}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        options:
          model: qwen-max
          temperature: 0.7
          # 注意：不能在这里配置 timeout，OpenAiChatOptions 没有 timeout 属性
          # 超时配置在 SpringAiTimeoutConfig 类中，通过 RestClient.Builder 实现
      # Embedding 模型配置（硅基流动 - OpenAI 兼容模式）
      embedding:
        api-key: ${SILICONFLOW_API_KEY:you_siliconflow_api_key}
        base-url: https://api.siliconflow.cn
        options:
          model: BAAI/bge-large-zh-v1.5
      # Rerank 模型配置（硅基流动 - 专用 Rerank API）
      rerank:
        api-key: ${SILICONFLOW_API_KEY:you_siliconflow_api_key}
        base-url: https://api.siliconflow.cn
        options:
          model: BAAI/bge-reranker-v2-m3
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
  data:
    redis:
      host: redis
      port: 6379

# MyBatis 配置：生产环境关闭 SQL 日志，避免性能开销和敏感数据泄露
mybatis-plus:
  configuration:
    # 关闭 SQL 日志（覆盖 application.yml 中的 StdOutImpl 配置）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.company.rag: INFO
    # 关闭 JDBC SQL 日志（避免泄露敏感数据）
    jdbc.sqlonly: WARN
    jdbc.sqltiming: WARN
    jdbc.audit: WARN
    jdbc.resultset: WARN
    jdbc.resultsettable: WARN
