version: '1.0'
name: CompanyRag CI
displayName: CompanyRag 持续集成流水线

# 触发规则
triggers:
  push:
    branches:
      prefix:
        - main
  tag:
    prefix:
      - v

# 流水线阶段
stages:
  # 阶段 1: Maven 构建和测试
  - stage: build-and-test
    displayName: Maven 构建与测试
    steps:
      - step: build@maven
        name: maven-build
        displayName: Maven 构建
        jdkVersion: "17"
        mavenVersion: 3.9.9
        commands: >-
          mvn clean package -B -DexcludedGroups=integration-test -Dsurefire.failIfNoSpecifiedTests=false
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./company-rag-bootstrap/target/*.jar
            type: .tar.gz

  # 阶段 2: Docker 镜像构建（仅标签触发时执行）
  - stage: docker-build
    displayName: Docker 镜像构建
    trigger:
      condition: tag
    steps:
      - step: build@docker
        name: build-docker-example
        displayName: 镜像构建
        outParamsAlias:
          GITEE_DOCKER_IMAGE: GITEE_DOCKER_IMAGE_0
        # 使用账号密码认证（不使用证书）
        type: account
        repository: "hub.gitee.com/${GITEE_USERNAME}/company-rag"
        username: "${GITEE_USERNAME}"
        password: "${GITEE_PASSWORD}"
        tag: "${GITEE_TAG}"
        dockerfile: ./Dockerfile
        context: ""
        artifacts: []
        isCache: false
        # 可选项：amd64, arm64
        processorType: "[amd64]"
        parameter: {}
