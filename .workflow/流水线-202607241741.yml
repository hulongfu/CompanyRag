version: '1.0'
name: CompanyRag CI
displayName: CompanyRag CI
triggers:
  push:
    branches:
      prefix:
        - main
  tag:
    prefix:
      - v
stages:
  - stage: Build and Test
    displayName: Build and Test
    steps:
      - step: build@maven
        name: Maven Build
        displayName: Maven 构建
        jdkVersion: "17"
        mavenVersion: 3.9.9
        commands: |
          mvn clean package -B
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./company-rag-bootstrap/target/*.jar
            type: .tar.gz
  - stage: Docker Build
    displayName: Docker Build
    steps:
      - step: build@docker
        name: Docker Build
        displayName: Docker 镜像构建
        image:
          tag: company-rag:${GITEE_TAG}
        dockerfile: ./Dockerfile