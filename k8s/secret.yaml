apiVersion: v1
kind: Secret
metadata:
  name: company-rag-secret
  namespace: default
# 以下为 base64 编码值，部署前必须替换为真实密钥：
#   echo -n "真实值" | base64           # 然后粘贴到对应字段
type: Opaque
data:
  # 外部 LLM API Key
  DASHSCOPE_API_KEY: "Y2hhbmdlbWU="                     # base64("changeme")
  SILICONFLOW_API_KEY: "Y2hhbmdlbWU="                   # base64("changeme")
  JWT_SECRET: "Y2hhbmdlbWU="                            # base64("changeme")

  # 应用用户 company_rag_app 的连接密码，须与 init.sql 内 CREATE USER 的密码一致
  # 以下为 base64("company_rag_app123456")，与 application.yml 默认值一致，生产请更换
  POSTGRES_PASSWORD: "Y29tcGFueV9yYWdfYXBwMTIzNDU2"
  # postgres 主进程超级用户（postgres）的密码，生产必须更换
  POSTGRES_SUPERUSER_PASSWORD: "Y2hhbmdlbWU="          # base64("changeme")