<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审计日志 - CompanyRag</title>
    <link rel="stylesheet" href="https://cdn.staticfile.net/element-plus/2.6.1/index.css">
    <script src="https://cdn.staticfile.net/vue/3.4.21/vue.global.prod.min.js"></script>
    <script src="https://cdn.staticfile.net/element-plus/2.6.1/index.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; height: 100vh; display: flex; flex-direction: column; }
        .app-header { height: 56px; background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; display: flex; align-items: center; padding: 0 24px; justify-content: space-between; flex-shrink: 0; }
        .app-header h1 { font-size: 20px; font-weight: 600; }
        .hdr-btn { display: inline-flex; align-items: center; justify-content: center; padding: 5px 15px; height: 32px; border-radius: 16px; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.15); color: #fff !important; font-size: 13px; cursor: pointer; transition: all .2s; white-space: nowrap; line-height: 1; }
        .hdr-btn:hover { background: rgba(255,255,255,.3); }
        .container { flex: 1; overflow-y: auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card h3 { font-size: 16px; margin-bottom: 16px; color: #303133; }
        .native-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .native-table th, .native-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #ebeef5; }
        .native-table th { background: #fafafa; font-weight: 600; color: #606266; }
        .native-table tbody tr:hover { background: #f5f7fa; }
        .native-table .cell-detail { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .readonly-tip { display: inline-flex; align-items: center; font-size: 11px; color: #909399; margin-left: 8px; }
    </style>
</head>
<body>
<div id="app">
    <header class="app-header">
        <h1>📋 审计日志</h1>
        <button class="hdr-btn" @click="goHome">← 返回首页</button>
    </header>

    <div class="container">
        <!-- 登录态校验：非 admin 直接跳回首页 -->
        <template v-if="role === 'admin'">
            <!-- 筛选区 -->
            <div class="card">
                <h3>🔍 筛选条件 <span class="readonly-tip">审计记录只读不可修改</span></h3>
                <el-form :inline="true" :model="filters">
                    <el-form-item label="租户">
                        <el-select v-model="filters.tenantId" placeholder="全部租户" clearable filterable size="small" style="width:180px;" @focus="loadTenants">
                            <el-option v-for="t in tenantOptions" :key="t.id" :label="t.name" :value="t.id" />
                        </el-select>
                    </el-form-item>
                    <el-form-item label="用户">
                        <el-select v-model="filters.userId" placeholder="全部用户" clearable filterable size="small" style="width:180px;" @focus="loadUsers">
                            <el-option v-for="u in userOptions" :key="u.id" :label="u.name" :value="u.id" />
                        </el-select>
                    </el-form-item>
                    <el-form-item label="动作类型">
                        <el-select v-model="filters.actionType" placeholder="全部" clearable size="small" style="width:180px;">
                            <el-option v-for="a in actionTypes" :key="a" :label="a" :value="a" />
                        </el-select>
                    </el-form-item>
                    <el-form-item label="开始时间">
                        <el-date-picker v-model="filters.startTime" type="datetime" placeholder="开始时间" size="small" style="width:190px;" value-format="YYYY-MM-DDTHH:mm:ss" />
                    </el-form-item>
                    <el-form-item label="结束时间">
                        <el-date-picker v-model="filters.endTime" type="datetime" placeholder="结束时间" size="small" style="width:190px;" value-format="YYYY-MM-DDTHH:mm:ss" />
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" size="small" @click="search">查询</el-button>
                        <el-button size="small" @click="resetFilters">重置</el-button>
                    </el-form-item>
                </el-form>
            </div>

            <!-- 表格区 -->
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <h3 style="margin:0;">📊 日志列表</h3>
                    <el-button size="small" @click="loadLogs">🔄 刷新</el-button>
                </div>
                <div v-loading="loading">
                    <table class="native-table">
                        <thead>
                            <tr>
                                <th style="width:80px;">ID</th>
                                <th style="width:90px;">租户</th>
                                <th style="width:80px;">用户</th>
                                <th style="width:120px;">动作类型</th>
                                <th style="width:90px;">目标类型</th>
                                <th style="width:90px;">目标 ID</th>
                                <th>详情</th>
                                <th style="width:165px;">IP</th>
                                <th style="width:175px;">时间</th>
                                <th style="width:70px;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="row in rows" :key="row.id">
                                <td>{{ row.id }}</td>
                                <td>{{ row.tenantId }}</td>
                                <td>{{ row.userId }}</td>
                                <td><el-tag size="small">{{ row.actionType }}</el-tag></td>
                                <td>{{ row.targetType }}</td>
                                <td>{{ row.targetId }}</td>
                                <td class="cell-detail">{{ row.detail }}</td>
                                <td>{{ row.ipAddress }}</td>
                                <td style="font-size:12px;color:#909399;">{{ row.createdAt }}</td>
                                <td><button class="table-btn" @click="showDetail(row)">详情</button></td>
                            </tr>
                            <tr v-if="rows.length === 0">
                                <td colspan="10" style="text-align:center;padding:40px;color:#909399;">暂无日志</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div style="display:flex;justify-content:flex-end;margin-top:16px;">
                    <el-pagination
                        background
                        layout="total, prev, pager, next, jumper"
                        :total="total"
                        :page-size="pageSize"
                        :current-page="page"
                        @current-change="changePage" />
                </div>
            </div>
        </template>

        <!-- 非 admin：提示权限不足 -->
        <div v-else class="card" style="text-align:center;padding:60px;color:#909399;">
            <h3 style="font-size:18px;color:#606266;">⛔ 权限不足</h3>
            <p style="margin-top:12px;">仅平台管理员可查看审计日志，3 秒后返回首页...</p>
        </div>
    </div>

    <!-- 详情抽屉 -->
    <el-drawer v-model="drawerVisible" title="审计日志详情" size="420px">
        <p style="margin-bottom:8px;color:#909399;font-size:12px;">审计记录不可修改</p>
        <el-descriptions :column="1" border>
            <el-descriptions-item label="ID">{{ current.id }}</el-descriptions-item>
            <el-descriptions-item label="租户 ID">{{ current.tenantId }}</el-descriptions-item>
            <el-descriptions-item label="用户 ID">{{ current.userId }}</el-descriptions-item>
            <el-descriptions-item label="动作类型">{{ current.actionType }}</el-descriptions-item>
            <el-descriptions-item label="目标类型">{{ current.targetType }}</el-descriptions-item>
            <el-descriptions-item label="目标 ID">{{ current.targetId }}</el-descriptions-item>
            <el-descriptions-item label="来源 IP">{{ current.ipAddress }}</el-descriptions-item>
            <el-descriptions-item label="时间">{{ current.createdAt }}</el-descriptions-item>
            <el-descriptions-item label="详情">
                <pre style="white-space:pre-wrap;word-break:break-word;font-family:inherit;">{{ current.detail }}</pre>
            </el-descriptions-item>
        </el-descriptions>
    </el-drawer>
</div>

<script>
(function() {
    // 立即检查登录态与角色，非 admin 无权限
    if (!localStorage.getItem('token') || localStorage.getItem('role') !== 'admin') {
        setTimeout(function() { window.location.href = '/'; }, 3000);
    }
})();
</script>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
    setup() {
        const role = ref(localStorage.getItem('role') || '');
        // filters 中的 tenantId 和 userId 存储的是 ID 值（数字），但下拉框显示的是名称
        const filters = ref({ tenantId: null, userId: null, actionType: '', startTime: '', endTime: '' });
        const actionTypes = ['LOGIN', 'LOGOUT', 'LOGIN_FAILED', 'CREATE', 'UPDATE', 'DELETE', 'UPLOAD', 'TOOL_CALL', 'MCP'];
        const rows = ref([]);
        const total = ref(0);
        const page = ref(1);
        const pageSize = ref(20);
        const loading = ref(false);
        const drawerVisible = ref(false);
        const current = ref({});
        
        // 租户和用户下拉选项
        const tenantOptions = ref([]);
        const userOptions = ref([]);
        const tenantsLoaded = ref(false);
        const usersLoaded = ref(false);

        function getToken() {
            return localStorage.getItem('token') || '';
        }

        async function apiRequest(url, options = {}) {
            if (!options.headers) options.headers = {};
            if (!options.headers['Authorization']) {
                options.headers['Authorization'] = 'Bearer ' + getToken();
            }
            const res = await fetch(url, options);
            if (res.status === 401) {
                ElementPlus.ElMessage.error('登录已过期，请重新登录');
                window.location.href = '/login';
                return null;
            }
            const json = await res.json();
            if (json && json.code === 401) {
                ElementPlus.ElMessage.error('登录已过期，请重新登录');
                window.location.href = '/login';
                return null;
            }
            if (json && json.code !== 200) {
                ElementPlus.ElMessage.error(json.msg || '请求失败');
            }
            return json;
        }

        // 加载租户列表（只加载一次）
        async function loadTenants() {
            if (tenantsLoaded.value) return;
            try {
                const json = await apiRequest('/api/tenant/list');
                if (json && json.code === 200 && json.data) {
                    tenantOptions.value = json.data.map(t => ({
                        id: t.id,
                        name: t.tenantName
                    }));
                    tenantsLoaded.value = true;
                }
            } catch (e) {
                console.error('加载租户列表失败', e);
            }
        }

        // 加载用户列表（只加载一次）
        async function loadUsers() {
            if (usersLoaded.value) return;
            try {
                const json = await apiRequest('/api/user/list');
                if (json && json.code === 200 && json.data) {
                    userOptions.value = json.data.map(u => ({
                        id: u.id,
                        name: u.displayName || u.username
                    }));
                    usersLoaded.value = true;
                }
            } catch (e) {
                console.error('加载用户列表失败', e);
            }
        }

        function buildQuery() {
            const params = new URLSearchParams();
            params.append('page', page.value);
            params.append('pageSize', pageSize.value);
            // filters.tenantId 和 filters.userId 存储的是 ID 值，直接传递给后端
            if (filters.value.tenantId) params.append('tenantId', filters.value.tenantId);
            if (filters.value.userId) params.append('userId', filters.value.userId);
            if (filters.value.actionType) params.append('actionType', filters.value.actionType);
            if (filters.value.startTime) params.append('startTime', filters.value.startTime);
            if (filters.value.endTime) params.append('endTime', filters.value.endTime);
            return params.toString();
        }

        async function loadLogs() {
            loading.value = true;
            try {
                const json = await apiRequest('/api/admin/audit-logs?' + buildQuery());
                if (json && json.code === 200 && json.data) {
                    rows.value = json.data.records || [];
                    total.value = json.data.total || 0;
                } else {
                    rows.value = [];
                    total.value = 0;
                }
            } catch (e) {
                console.error('加载审计日志失败', e);
                ElementPlus.ElMessage.error('加载失败');
            } finally {
                loading.value = false;
            }
        }

        function search() { page.value = 1; loadLogs(); }
        function resetFilters() {
            filters.value = { tenantId: null, userId: null, actionType: '', startTime: '', endTime: '' };
            search();
        }
        function changePage(p) { page.value = p; loadLogs(); }
        function showDetail(row) { current.value = row; drawerVisible.value = true; }
        function goHome() { window.location.href = '/'; }

        onMounted(() => { if (role.value === 'admin') loadLogs(); });

        return { 
            role, filters, actionTypes, rows, total, page, pageSize, loading,
            drawerVisible, current, tenantOptions, userOptions,
            loadTenants, loadUsers, loadLogs, search, resetFilters, changePage, showDetail, goHome 
        };
    }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
